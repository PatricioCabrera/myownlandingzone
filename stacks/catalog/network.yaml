# For platform or shared infrastructure only. Projects build their own VPC from a
# range in ip-allocations. vpc_cidr must match the "platform-network" allocation.
# No stack imports this yet.
components:
  terraform:
    network:
      backend:
        s3:
          workspace_key_prefix: myownlandingzone/network
      vars:
        vpc_cidr: 10.1.0.0/21
        subnets:
          public-a:
            cidr: 10.1.0.0/24
            public: true
            az_index: 0
          public-b:
            cidr: 10.1.1.0/24
            public: true
            az_index: 1
          private-a:
            cidr: 10.1.2.0/24
            public: false
            az_index: 0
          private-b:
            cidr: 10.1.3.0/24
            public: false
            az_index: 1
