# Shared by every stack. Each deploy file sets its own bucket, and Atmos selects a
# workspace per stack, so state lands at <workspace_key_prefix>/<stack>/terraform.tfstate.
vars:
  aws_region: us-east-1

terraform:
  backend_type: s3
  backend:
    s3:
      key: terraform.tfstate
      region: us-east-1
      encrypt: true
      use_lockfile: true
