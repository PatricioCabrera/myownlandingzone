# Runs as the management account. Nothing here is reachable from CI.
import:
  - catalog/defaults
  - catalog/tfstate
  - catalog/organization
  - catalog/identity-center

vars:
  stage: management
  account_id: '{{ with env "MANAGEMENT_ACCOUNT_ID" }}{{ . }}{{ else }}{{ fail "Set MANAGEMENT_ACCOUNT_ID, see .env.example" }}{{ end }}'

env:
  AWS_PROFILE: management

terraform:
  backend:
    s3:
      bucket: 'myownlandingzone-tfstate-{{ env "MANAGEMENT_ACCOUNT_ID" }}-us-east-1-an'

components:
  terraform:
    tfstate:
      vars:
        bucket_name: 'myownlandingzone-tfstate-{{ env "MANAGEMENT_ACCOUNT_ID" }}-us-east-1-an'
    identity-center:
      vars:
        # Provisioned to management, so only management can change it. Also grants
        # identity, which is how the first sign-in to that account happens.
        permission_sets:
          PlatformAdmin:
            session_duration: PT1H
            managed_policy_arns:
              - arn:aws:iam::aws:policy/AdministratorAccess
        assignments:
          PlatformAdmin:
            - management
            - identity
