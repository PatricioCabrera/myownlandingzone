# Runs as the workloads account. Its state bucket predates this repo.
import:
  - catalog/defaults
  - catalog/ip-allocations
  - catalog/budget
  - catalog/ci-identity

vars:
  stage: workloads
  account_id: '{{ with env "WORKLOADS_ACCOUNT_ID" }}{{ . }}{{ else }}{{ fail "Set WORKLOADS_ACCOUNT_ID, see .env.example" }}{{ end }}'

env:
  AWS_PROFILE: workloads

terraform:
  backend:
    s3:
      bucket: 'tfstate-{{ env "WORKLOADS_ACCOUNT_ID" }}-us-east-1-an'

# settings.ci.enabled marks what the pipeline may plan and apply. Anything without
# it is run by a person. ci-identity must stay that way: see docs/ci.md.
components:
  terraform:
    ip-allocations:
      settings:
        ci:
          enabled: true
    budget:
      settings:
        ci:
          enabled: true
      vars:
        limit_usd: 10
        # Created by CloudLaunchpad before the platform adopted them. AWS replaces
        # both when renamed.
        budget_name: budget-cloudlaunchpad-monthly
        anomaly_subscription_name: immediate_subscription_cloudlaunchpad
    ci-identity:
      vars:
        # CloudLaunchpad created this account's GitHub OIDC provider and still owns it.
        create_oidc_provider: false
        apply_environment: workloads
        state_bucket: 'tfstate-{{ env "WORKLOADS_ACCOUNT_ID" }}-us-east-1-an'
