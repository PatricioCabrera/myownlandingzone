name: Drift

# A plan only runs when someone opens a pull request, so a change made by hand in
# the console stays invisible until then. This plans every CI-managed component
# on a schedule and opens an issue when AWS no longer matches the code.
on:
  schedule:
    - cron: "17 11 * * 1" # Mondays 08:17 in Buenos Aires
  workflow_dispatch:

permissions: {}

concurrency:
  group: drift
  cancel-in-progress: false

env:
  ATMOS_TELEMETRY_ENABLED: "false"
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  MANAGEMENT_ACCOUNT_ID: ${{ secrets.MANAGEMENT_ACCOUNT_ID }}
  IDENTITY_ACCOUNT_ID: ${{ secrets.IDENTITY_ACCOUNT_ID }}
  WORKLOADS_ACCOUNT_ID: ${{ secrets.WORKLOADS_ACCOUNT_ID }}
  TF_VAR_notification_email: ${{ secrets.NOTIFICATION_EMAIL }}

jobs:
  matrix:
    name: List CI-managed components
    if: vars.CI_AWS_ENABLED == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: $/.github/actions/setup

      - id: matrix
        run: echo "matrix=$(.github/scripts/matrix.sh all)" >> "${GITHUB_OUTPUT}"

  drift:
    name: Drift ${{ matrix.component }} (${{ matrix.stack }})
    needs: matrix
    if: needs.matrix.outputs.matrix != '[]'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      issues: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: $/.github/actions/setup

      - id: plan
        uses: $/.github/actions/plan
        with:
          component: ${{ matrix.component }}
          stack: ${{ matrix.stack }}
          role-arn: arn:aws:iam::${{ secrets.WORKLOADS_ACCOUNT_ID }}:role/myownlandingzone-ci-plan

      # One open issue per component. A repeat finding adds a comment instead of
      # a second issue.
      - name: Report drift
        if: steps.plan.outputs.changes != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: "Drift: ${{ matrix.component }} (${{ matrix.stack }})"
        run: |
          head -c 60000 plan-out/summary.md > body.md
          number="$(gh issue list --repo "${GITHUB_REPOSITORY}" --state open --search "in:title \"${TITLE}\"" \
            --json number --jq '.[0].number // empty')"
          if [ -n "${number}" ]; then
            gh issue comment "${number}" --repo "${GITHUB_REPOSITORY}" --body-file body.md
          else
            gh issue create --repo "${GITHUB_REPOSITORY}" --title "${TITLE}" --body-file body.md
          fi
